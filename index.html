<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="伍鑫 - 前端开发工程师">
  <title>伍鑫 · 前端开发工程师</title>
  <style>
    :root {
      --ink: #121314;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #4fc08d;
      --bg: #fbfbfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Rubik', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      font-size: 16px;
    }

    a {
      color: inherit;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== Hero ===== */
    .hero {
      padding: 11vh 0 6vh;
    }

    .hero .eyebrow {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    .hero .tagline {
      margin-top: 18px;
      font-size: 1.15rem;
      font-weight: 300;
      color: #3a3f45;
      max-width: 30em;
    }

    .contact {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .contact a,
    .contact .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 15px;
      background: #fff;
      transition: border-color 0.2s, color 0.2s, transform 0.15s;
    }

    .contact a:hover {
      border-color: var(--accent);
      color: #0c8f5e;
      transform: translateY(-1px);
    }

    /* ===== Sections ===== */
    .section {
      padding: 44px 0;
      border-top: 1px solid var(--line);
    }

    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: "";
      width: 22px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
    }

    /* ===== Open source ===== */
    .oss-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .oss-item .name {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .oss-item .stack {
      margin-top: 4px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .oss-item .demo {
      margin-top: 10px;
      font-size: 0.88rem;
    }

    .oss-item .demo a {
      color: #0c8f5e;
      text-decoration: none;
      border-bottom: 1px dashed #9bdcc0;
      transition: border-color 0.2s;
      word-break: break-all;
    }

    .oss-item .demo a:hover {
      border-color: #0c8f5e;
    }

    /* ===== Footer ===== */
    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 44px;
      margin-top: 12px;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .beian {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 18px;
    }

    .beian a {
      display: inline-flex;
      align-items: center;
      height: 20px;
      line-height: 20px;
      text-decoration: none;
      font-size: 0.8rem;
      color: #939393;
    }

    .beian img {
      height: 20px;
      margin-right: 5px;
    }

    @media (max-width: 600px) {
      body {
        font-size: 15px;
      }
      .hero {
        padding: 8vh 0 5vh;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- ===== Hero ===== -->
    <header class="hero">
      <div class="eyebrow">Front-end Engineer</div>
      <h1>你好，我是伍鑫</h1>
      <p class="tagline">前端开发工程师，现居广州。</p>
      <div class="contact">
        <a href="mailto:hello_wuxin@qq.com">✉ hello_wuxin@qq.com</a>
        <a href="https://github.com/hellowuxin" target="_blank" rel="noopener">⌥ github.com/hellowuxin</a>
        <span class="chip">☎ 15218355058</span>
      </div>
    </header>

    <!-- ===== 开源作品 ===== -->
    <section class="section" id="opensource">
      <h2 class="section-title">开源作品</h2>
      <div class="oss-item">
        <div class="name">思维导图组件</div>
        <div class="stack">Vue.js · D3.js · TypeScript</div>
        <div class="demo">在线演示：<a href="https://5xin.xyz/vue3-mindmap" target="_blank" rel="noopener">https://5xin.xyz/vue3-mindmap</a></div>
      </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer>
      <div class="footer-inner">
        <div class="beian">
          <a target="_blank" href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44090202000405">
            <img src="备案图标.png" alt="备案图标"/>
            粤公网安备 44090202000405号
          </a>
          <a target="_blank" href="http://beian.miit.gov.cn/">粤ICP备19065551号</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
